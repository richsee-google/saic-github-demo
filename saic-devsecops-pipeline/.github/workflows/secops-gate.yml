name: SAIC Enterprise DevSecOps Security Gate

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  sast_and_container_scan:
    name: SAST, Container Scan & FedRAMP Compliance Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run SAST Security Scan (Semgrep)
        run: |
          pip install semgrep
          semgrep --config p/ci --error

      - name: Build Hardened Container Image
        run: |
          docker build -t gcr.io/${{ secrets.GCP_PROJECT }}/saic-agent-service:latest .

      - name: Run Container Vulnerability Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'gcr.io/${{ secrets.GCP_PROJECT }}/saic-agent-service:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Cosign Container Image Signing (KMS CMEK)
        run: |
          echo "Signing container image with GCP KMS key saic-cmek-v1..."
